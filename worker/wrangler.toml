name = "purge-signups"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# Create the namespace once with:  wrangler kv namespace create SIGNUPS_KV
# then paste the printed id below.
kv_namespaces = [
  { binding = "SIGNUPS_KV", id = "080b0d66de544ebe9c5ac9f6f55bf9da" }
]

# Canonical guild data (matches/extendedStats/rosterMembers/profiles/attendance)
# — created once with `wrangler d1 create purge-guild-db`, schema in schema.sql.
# Apply/update the schema with:
#   wrangler d1 execute purge-guild-db --local --file=schema.sql   (dev)
#   wrangler d1 execute purge-guild-db --remote --file=schema.sql  (prod)
[[d1_databases]]
binding = "DB"
database_name = "purge-guild-db"
database_id = "7f4e96cb-d0dc-4199-b472-00a4a12329aa"

# Not secret — the OAuth app's public client id + the Purge guild id (same
# values as the bot's bot/src/config.js CLIENT_ID/GUILD_ID). GUILD_ID gates
# login itself (auth.js isGuildMember) — officer roles are still managed from
# the website by family name, not Discord role IDs.
[vars]
DISCORD_CLIENT_ID = "1519482554917584916"
GUILD_ID = "1519194192419750049"

# Secrets are NOT stored here — set them with:
#   wrangler secret put DISCORD_BOT_TOKEN     (same value as the bot's DISCORD_TOKEN)
#   wrangler secret put ADMIN_POST_PASSWORD   (shared password admins type on the site — kept as a break-glass fallback)
#   wrangler secret put BOT_PUSH_SECRET       (must match the bot's BOT_PUSH_SECRET)
#   wrangler secret put DISCORD_CLIENT_SECRET (Discord Developer Portal → OAuth2 → client secret)
#   wrangler secret put SESSION_SECRET        (any long random string — signs the login token; changing it logs everyone out)
# For local `wrangler dev`, put the same five in worker/.dev.vars (git-ignored).
